name: Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: |
          The GitHub deployment environment.
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
  workflow_call:
    inputs:
      environment:
        description: |
          The GitHub deployment environment.
        required: false
        type: string
        default: development
      validate_only:
        description: Run checks without deploying.
        type: boolean
        default: false

concurrency:
  # Per environment, so a production deploy waiting for approval never holds back or cancels a staging deploy.
  group: deployment-${{ inputs.environment || 'staging' }}${{ inputs.validate_only && '-validation' || '' }}
  cancel-in-progress: false

jobs:
  determineenvironment:
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Determine Environment
        id: set-env
        run: |
          if [[ -z "${{ inputs.environment }}" ]]; then
            echo "environment=staging" >> "$GITHUB_OUTPUT"
          else
            echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          fi
  vars:
    if: >-
      !inputs.validate_only &&
      (needs.determineenvironment.outputs.environment != 'production' ||
        (github.repository == 'SchmiedmayerLab/Plainly-Firebase' &&
          github.event_name == 'release' && github.event.action == 'published' &&
          !github.event.release.prerelease))
    name: Inject Environment Variables In Deployment Workflow
    needs: determineenvironment
    runs-on: ubuntu-latest
    environment: ${{ needs.determineenvironment.outputs.environment }}
    outputs:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
    steps:
      - run: |
          echo "Injecting Environment Variables In Deployment Workflow: ${{ vars.FIREBASE_PROJECT_ID }}"
  buildandtest:
    name: Build and Test
    needs: determineenvironment
    uses: ./.github/workflows/build-and-test.yml
    permissions:
      contents: read
      checks: write
      pull-requests: read
    secrets: inherit
  deployfirebase:
    name: Deploy Firebase Project
    needs: [buildandtest, determineenvironment, vars]
    uses: SchmiedmayerLab/.github/.github/workflows/firebase-deploy.yml@v0.5
    permissions:
      contents: read
    with:
      customcommand: "npm --prefix functions install"
      environment: ${{ needs.determineenvironment.outputs.environment }}
      arguments: '--project ${{ needs.vars.outputs.FIREBASE_PROJECT_ID }}'
    secrets:
      GOOGLE_APPLICATION_CREDENTIALS_BASE64: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_BASE64 }}
