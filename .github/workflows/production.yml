name: Production Deployment

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  verifyrelease:
    name: Verify Released Commit
    if: >-
      github.repository == 'SchmiedmayerLab/Plainly-Firebase' &&
      (github.event_name == 'workflow_dispatch' || !github.event.release.prerelease)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a commit on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main. Production deploys only commits that are on main."
            exit 1
          fi
  deployment:
    name: Production Deployment
    needs: verifyrelease
    uses: ./.github/workflows/deployment.yml
    permissions:
      contents: read
      checks: write
      pull-requests: read
    secrets: inherit
    with:
      environment: production
      validate_only: ${{ github.event_name == 'workflow_dispatch' }}
