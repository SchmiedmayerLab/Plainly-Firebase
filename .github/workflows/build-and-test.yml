name: Build and Test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  reuseaction:
    name: REUSE Compliance Check
    uses: SchmiedmayerLab/.github/.github/workflows/reuse.yml@v0.5
  markdownlinkcheck:
    name: Markdown Link Check
    permissions:
      contents: read
      pull-requests: read
    uses: SchmiedmayerLab/.github/.github/workflows/markdown-links.yml@v0.5
    with:
      runs_on_labels: '["ubuntu-latest"]'
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: 'true'
      - name: Git LFS Pull
        run: git lfs pull
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Install Dependencies
        run: |
          npm --prefix functions ci
          npm --prefix web ci
      - name: Build Functions
        run: npm --prefix functions run build
      - name: Lint Functions
        run: npm --prefix functions run lint
      - name: Lint Web Client
        run: npm --prefix web run lint
    permissions:
      contents: read
  buildandtest:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: 'true'
      - name: Git LFS Pull
        run: git lfs pull
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '21'
      - name: Install Dependencies
        run: |
          npm --prefix functions ci
          npm --prefix web ci
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.25.1
      - name: Build Functions
        run: npm --prefix functions run build
      - name: Test Functions with Coverage
        id: test
        run: npm --prefix functions run test:coverage
      - name: Check Diff Coverage
        if: ${{ github.event_name == 'pull_request' }}
        run: npm --prefix functions run test:diff-coverage -- "${{ github.event.pull_request.base.sha }}"
      - name: Test Firebase Integration
        run: >-
          firebase emulators:exec
          --project demo-plainly
          --only auth,functions,firestore,storage
          "npm --prefix functions run test:integration"
        env:
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: true
          OPENAI_API_KEY: integration-test-key
          PLAINLY_MOCK_CHAT_RESPONSE: Plainly Firebase integration response.
      - name: Build Web Client
        run: npm --prefix web run build
    permissions:
      contents: read
